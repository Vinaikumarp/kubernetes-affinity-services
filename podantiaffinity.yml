apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frame
  template:
    metadata:
      labels:
        app: frame
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: frame
              topologyKey: kubernetes.io/hostname
      containers:
        - name: podantiaffinity
          image: vinaikumarp/web-image:1.0

