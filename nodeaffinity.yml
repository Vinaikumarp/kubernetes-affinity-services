apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mens-shopping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping
  template:
    metadata:
      labels:
        app: shopping
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: shopping
              topologyKey: kubernetes.io/hostname
      containers:
        - name: podaffinity
          image: vinaikumarp/mens-image:1.0

